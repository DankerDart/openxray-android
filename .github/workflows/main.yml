name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'alpha-*'

jobs:
  android:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout (со сабмодулями)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK 27 + CMake 3.22.1 + SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Сборка assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g"

      - name: Отчёт и APK
        uses: actions/upload-artifact@v4
        with:
          name: openxray-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
