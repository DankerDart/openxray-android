# Fat LTO on this codebase peaks well past the 2 GB default in the link step,
# which killed the release build with an OOM. 6 GB is enough for a 16-core
# -flto-job-count run; raise it if the daemon still dies on a big link.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
